<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trends Beauty Spa and Barber | Kiambu Road</title>
<meta name="description" content="Nails, salon, massage, spa and barbershop on Kiambu Road. Indulge in elegance. Nails that sparkle!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#622159;
    --deep:#3F1239;
    --lilac:#EBDDF0;
    --blush:#FAF5FB;
    --gold:#E2B64E;
    --white:#FFFFFF;
    --head:'Cormorant Garamond', Georgia, serif;
    --body:'Jost', system-ui, sans-serif;
    --script:'Dancing Script', cursive;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--body);color:var(--deep);background:var(--blush);line-height:1.65;font-size:17px;overflow-x:hidden}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--gold);outline-offset:3px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}
  h1,h2,h3{font-family:var(--head);font-weight:700;line-height:1.05}

  .btn{display:inline-block;background:var(--gold);color:var(--deep);text-decoration:none;font-weight:600;padding:14px 28px;border:2px solid var(--deep);border-radius:999px;box-shadow:5px 5px 0 var(--deep);cursor:pointer;font-family:var(--body);font-size:1rem;transition:transform .15s, box-shadow .15s}
  .btn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--deep)}
  .btn.ghost{background:transparent;color:var(--white);border-color:var(--white);box-shadow:5px 5px 0 var(--gold)}
  .btn.ghost:hover{box-shadow:3px 3px 0 var(--gold)}

  .bar{position:sticky;top:0;z-index:10;background:var(--plum);color:var(--white);border-bottom:3px solid var(--gold)}
  .bar .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:var(--head);font-size:1.25rem;font-weight:700}
  .brand img{width:44px;height:44px;border-radius:10px;border:2px solid var(--gold)}
  .bar .btn{padding:8px 20px;font-size:.95rem;box-shadow:none;border-color:var(--gold)}

  /* hero */
  .hero{background:var(--plum);color:var(--white);padding:60px 0 84px;position:relative;overflow:hidden}
  .hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:44px;align-items:center}
  .rate{display:inline-block;border:2px solid var(--gold);color:var(--gold);border-radius:999px;padding:4px 16px;font-weight:600;font-size:.9rem;margin-bottom:20px}
  .hero h1{font-size:clamp(3rem,9vw,5.6rem);margin-bottom:6px}
  .hero .script{font-family:var(--script);font-size:clamp(1.9rem,5vw,2.8rem);color:var(--gold);display:inline-block;transform:rotate(-3deg);margin-bottom:18px}
  .hero p.lead{font-size:1.15rem;max-width:34ch;margin-bottom:28px;color:var(--lilac)}
  .btns{display:flex;gap:16px;flex-wrap:wrap}
  .archwrap{position:relative;max-width:380px;margin:0 auto;width:100%}
  .archwrap::before{content:"";position:absolute;inset:0;transform:translate(16px,16px);border-radius:999px 999px 24px 24px;background:var(--gold)}
  .arch{position:relative;aspect-ratio:3/4;border-radius:999px 999px 24px 24px;border:4px solid var(--white);overflow:hidden;background:var(--lilac)}
  .arch img{width:100%;height:100%;object-fit:cover;object-position:50% 70%}
  .sp{position:absolute;z-index:3;fill:var(--gold);stroke:var(--white);stroke-width:2;animation:twinkle 2.8s ease-in-out infinite}
  .sp.a{width:54px;top:-20px;right:-6px}
  .sp.b{width:34px;top:44%;left:-22px;animation-delay:.8s}
  .sp.c{width:42px;bottom:-18px;left:12%;animation-delay:1.6s}
  .sp.d{width:26px;top:12%;left:-8px;animation-delay:.3s}
  @keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(.6) rotate(25deg)}}

  .ticker{background:var(--deep);color:var(--gold);overflow:hidden;white-space:nowrap}
  .tick{display:inline-flex;animation:tick 30s linear infinite;padding:12px 0;font-family:var(--head);font-size:1.3rem;font-weight:700;letter-spacing:.5px}
  .tick span{padding:0 20px}
  .tick span::after{content:"\2726";margin-left:40px;color:var(--white)}
  @keyframes tick{to{transform:translateX(-50%)}}

  section.block{padding:80px 0}
  section.block h2{font-size:clamp(2.2rem,6vw,3.4rem);margin-bottom:10px}
  .sub{margin-bottom:38px;max-width:50ch}

  /* nail bar */
  .nails{background:var(--lilac);border-top:3px solid var(--plum);border-bottom:3px solid var(--plum)}
  .nails .wrap{display:grid;grid-template-columns:.8fr 1.2fr;gap:44px;align-items:start}
  .nails h2{letter-spacing:6px;font-size:clamp(2.4rem,7vw,4rem);color:var(--plum)}
  .nails .tagline{font-family:var(--script);font-size:1.9rem;color:var(--plum);line-height:1.2;margin:14px 0 22px}
  .menu{background:var(--white);border:3px solid var(--plum);border-radius:24px;padding:24px 28px;box-shadow:8px 8px 0 var(--plum)}
  .item{display:flex;align-items:baseline;gap:10px;padding:10px 0;text-decoration:none;text-transform:uppercase;letter-spacing:1px;font-size:.95rem}
  .item .dots{flex:1;border-bottom:2px dotted var(--plum);opacity:.5;transform:translateY(-4px)}
  .item .price{font-weight:600;color:var(--plum);white-space:nowrap}
  .item:hover .name{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:5px;text-decoration-thickness:3px}
  .menu small{display:block;text-align:center;margin-top:14px;font-size:.85rem}

  /* spa */
  .spa .wrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:48px;align-items:center}
  .spaimg{border:3px solid var(--plum);border-radius:28px;overflow:hidden;box-shadow:10px 10px 0 var(--gold);aspect-ratio:4/5;background:var(--lilac)}
  .spaimg img{width:100%;height:100%;object-fit:cover}
  .cards{display:grid;gap:16px;margin:26px 0}
  .card{background:var(--white);border:2px solid var(--plum);border-radius:18px;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;text-decoration:none;transition:transform .15s}
  .card:hover{transform:translateX(6px)}
  .card h3{font-size:1.5rem}
  .card p{font-size:.95rem;line-height:1.4}
  .mini{list-style:none;margin-top:8px;font-size:.9rem}
  .mini li{display:flex;justify-content:space-between;gap:12px;border-top:1px dotted var(--plum);padding:4px 0}
  .card span{font-weight:600;color:var(--plum);white-space:nowrap}

  /* happy place band */
  .happy{background:var(--plum);color:var(--white);text-align:center;padding:72px 0}
  .happy q{display:block;font-family:var(--script);font-size:clamp(2.4rem,7vw,4.4rem);color:var(--gold);line-height:1.15;margin-bottom:12px;quotes:none}
  .happy p{max-width:44ch;margin:0 auto 26px;color:var(--lilac)}

  /* visit */
  .visit .wrap{display:grid;grid-template-columns:1fr 1fr;gap:36px}
  .hrs{list-style:none}
  .hrs li{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:2px dotted var(--plum)}
  .find{background:var(--plum);color:var(--white);border:3px solid var(--deep);border-radius:24px;padding:32px;box-shadow:8px 8px 0 var(--gold)}
  .find h3{font-size:1.9rem;margin-bottom:12px}
  .find p{margin-bottom:8px}
  .find .btn{margin-top:16px}
  .find a.link{display:block;margin-top:12px;color:var(--gold)}
  .mapbox{grid-column:1/-1;border:3px solid var(--plum);border-radius:24px;overflow:hidden;box-shadow:8px 8px 0 var(--plum)}
  .mapbox iframe{display:block;width:100%;height:340px;border:0}

  footer{background:var(--deep);color:var(--lilac);padding:34px 0;text-align:center;font-size:.95rem}
  footer img{width:64px;height:64px;border-radius:14px;border:2px solid var(--gold);margin:0 auto 12px;display:block}
  footer a{color:var(--gold)}
  .wa{position:fixed;right:18px;bottom:18px;z-index:20;background:var(--gold);color:var(--deep);border:2px solid var(--deep);border-radius:999px;padding:12px 22px;font-weight:600;text-decoration:none;box-shadow:4px 4px 0 var(--deep)}

  @media (max-width:760px){
    .hero{padding:38px 0 64px}
    .hero .wrap,.nails .wrap,.spa .wrap,.visit .wrap{grid-template-columns:1fr}
    .archwrap{max-width:290px;order:-1;margin-bottom:12px}
    .spaimg{max-width:360px;margin:0 auto}
    .brand span{font-size:1.05rem}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <a class="brand" href="#top"><img id="navLogo" alt="Trends logo"><span id="brandName"></span></a>
    <a class="btn" id="barBook" href="#">Book now</a>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div>
        <span class="rate" id="rate"></span>
        <h1 id="heroTitle"></h1>
        <span class="script" id="script"></span>
        <p class="lead" id="lead"></p>
        <div class="btns">
          <a class="btn" id="heroBook" href="#">Book on WhatsApp</a>
          <a class="btn ghost" href="#nails">See the nail bar</a>
        </div>
      </div>
      <div class="archwrap">
        <svg class="sp a" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3 C34 22 42 30 61 32 C42 34 34 42 32 61 C30 42 22 34 3 32 C22 30 30 22 32 3Z"/></svg>
        <svg class="sp b" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3 C34 22 42 30 61 32 C42 34 34 42 32 61 C30 42 22 34 3 32 C22 30 30 22 32 3Z"/></svg>
        <svg class="sp c" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3 C34 22 42 30 61 32 C42 34 34 42 32 61 C30 42 22 34 3 32 C22 30 30 22 32 3Z"/></svg>
        <svg class="sp d" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3 C34 22 42 30 61 32 C42 34 34 42 32 61 C30 42 22 34 3 32 C22 30 30 22 32 3Z"/></svg>
        <div class="arch"><img id="heroImg" alt="Clients enjoying their time at Trends"></div>
      </div>
    </div>
  </section>

  <div class="ticker" aria-hidden="true"><div class="tick" id="tick"></div></div>

  <section class="block nails" id="nails">
    <div class="wrap">
      <div>
        <h2>NAIL BAR</h2>
        <p class="tagline" id="tagline"></p>
        <p>Tap any service to book it on WhatsApp.</p>
      </div>
      <div class="menu" id="menu"></div>
    </div>
  </section>

  <section class="block spa" id="spa">
    <div class="wrap">
      <div class="spaimg"><img id="spaImg" alt="A relaxing treatment at Trends"></div>
      <div>
        <h2>More than nails</h2>
        <p id="spaText"></p>
        <div class="cards" id="cards"></div>
        <a class="btn" id="spaBook" href="#">Ask about prices</a>
      </div>
    </div>
  </section>

  <section class="happy">
    <div class="wrap">
      <q id="quote"></q>
      <p id="quoteText"></p>
      <a class="btn" id="igBtn" href="#" target="_blank" rel="noopener">Follow us on Instagram</a>
    </div>
  </section>

  <section class="block visit" id="visit">
    <div class="wrap">
      <div id="hoursBox">
        <h2 style="margin-bottom:20px">Opening hours</h2>
        <ul class="hrs" id="hrs"></ul>
      </div>
      <div class="find">
        <h3>Come and visit</h3>
        <p id="addr"></p>
        <p id="phoneLine"></p>
        <a class="btn" id="visitBook" href="#">Book your visit</a>
        <a class="link" id="dir" href="#" target="_blank" rel="noopener">Get directions on Google Maps</a>
      </div>
      <div class="mapbox">
        <iframe id="map" title="Map showing Trends on Kiambu Road" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <img id="footLogo" alt="Trends logo">
    <div id="footName"></div>
    <div style="margin-top:8px">Website by <a id="builder" href="#">JMG Tech Hub</a></div>
  </div>
</footer>

<a class="wa" id="floatWa" href="#">Chat on WhatsApp</a>
